<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory — Internal</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Pro:ital,wght@0,400;1,400&display=swap');
    *{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --bg:#0d0f14;--surface:#13161e;--surface2:#1a1e2a;
      --gold:#c9a84c;--gold2:#e8c97a;--ember:#d4541a;
      --text:#e8e2d5;--muted:#7a7467;
      --border:rgba(201,168,76,0.12);--border2:rgba(201,168,76,0.25);
      --green:#4a9e6b;--red:#b84040;
      --serif:'Cinzel',serif;--body:'Crimson Pro',Georgia,serif;
    }
    body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;min-height:100vh;}
    .login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem;}
    .login-box{background:var(--surface);border:1px solid var(--border2);padding:2.5rem;width:100%;max-width:360px;text-align:center;}
    .login-title{font-family:var(--serif);font-size:18px;color:var(--gold);letter-spacing:0.15em;margin-bottom:6px;}
    .login-sub{font-size:15px;color:var(--muted);font-style:italic;margin-bottom:2rem;}
    .login-box input[type=password]{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:var(--body);font-size:16px;padding:11px 14px;outline:none;text-align:center;letter-spacing:0.2em;margin-bottom:1rem;border-radius:4px;}
    .login-box input[type=password]:focus{border-color:var(--border2);}
    .login-btn{width:100%;padding:13px;font-family:var(--serif);font-size:12px;letter-spacing:0.18em;background:var(--gold);color:#0d0f14;border:none;cursor:pointer;border-radius:4px;}
    .login-btn:hover{background:var(--gold2);}
    .login-error{font-size:14px;color:var(--red);font-style:italic;margin-top:10px;min-height:20px;}
    .dash{display:none;}
    .dash.active{display:block;}
    .dash-nav{background:var(--surface);border-bottom:1px solid var(--border2);padding:0 2rem;height:60px;display:flex;align-items:center;justify-content:space-between;}
    .dash-logo{font-family:var(--serif);font-size:15px;color:var(--gold);letter-spacing:0.14em;}
    .dash-tag{font-family:var(--serif);font-size:11px;color:var(--ember);letter-spacing:0.2em;margin-left:12px;}
    .dash-logout{font-family:var(--serif);font-size:11px;letter-spacing:0.12em;color:var(--muted);background:none;border:1px solid var(--border);padding:6px 14px;cursor:pointer;border-radius:4px;}
    .dash-logout:hover{color:var(--gold);border-color:var(--border2);}
    .dash-body{padding:2rem;max-width:1100px;margin:0 auto;}
    .loading{text-align:center;padding:4rem;font-family:var(--serif);font-size:13px;color:var(--muted);letter-spacing:0.15em;}
    .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:2rem;}
    .stat{background:var(--surface);border:1px solid var(--border);padding:1rem 1.25rem;}
    .stat-label{font-family:var(--serif);font-size:10px;color:var(--muted);letter-spacing:0.18em;margin-bottom:5px;}
    .stat-value{font-family:var(--serif);font-size:22px;color:var(--text);}
    .stat-value.warn{color:var(--ember);}
    .stat-value.ok{color:var(--green);}
    .toolbar{display:flex;gap:10px;margin-bottom:1.25rem;flex-wrap:wrap;align-items:center;}
    .inv-search{flex:1;min-width:180px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:var(--body);font-size:15px;padding:8px 12px;outline:none;border-radius:4px;}
    .inv-search:focus{border-color:var(--border2);}
    .filter-btns{display:flex;gap:6px;}
    .fbtn{font-family:var(--serif);font-size:10px;letter-spacing:0.1em;padding:6px 13px;background:transparent;color:var(--muted);border:1px solid var(--border);cursor:pointer;border-radius:4px;}
    .fbtn.active{color:var(--gold);border-color:var(--border2);}
    .mark-all-btn{font-family:var(--serif);font-size:10px;letter-spacing:0.1em;padding:6px 13px;background:transparent;color:var(--muted);border:1px solid var(--border);cursor:pointer;border-radius:4px;margin-left:auto;}
    .mark-all-btn:hover{color:var(--gold);border-color:var(--border2);}
    .inv-section{margin-bottom:2.5rem;}
    .inv-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;padding-bottom:8px;border-bottom:1px solid var(--border2);}
    .inv-section-title{font-family:var(--serif);font-size:13px;color:var(--ember);letter-spacing:0.2em;}
    .inv-section-count{font-family:var(--serif);font-size:11px;color:var(--muted);letter-spacing:0.12em;}
    .color-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;}
    .color-item{background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:0.6rem 0.75rem;display:flex;align-items:center;gap:10px;cursor:pointer;transition:border-color 0.15s;user-select:none;}
    .color-item:hover{border-color:var(--border2);}
    .color-item.in-stock{border-left:3px solid var(--green);}
    .color-item.out-of-stock{border-left:3px solid var(--red);opacity:0.55;}
    .color-swatch{width:24px;height:24px;border-radius:50%;flex-shrink:0;border:1px solid rgba(255,255,255,0.1);}
    .color-name{font-size:14px;color:var(--text);flex:1;}
    .color-item.out-of-stock .color-name{color:var(--muted);}
    .color-status{font-family:var(--serif);font-size:9px;letter-spacing:0.08em;flex-shrink:0;}
    .color-item.in-stock .color-status{color:var(--green);}
    .color-item.out-of-stock .color-status{color:var(--red);}
    .color-checkbox{width:17px;height:17px;accent-color:var(--gold);cursor:pointer;flex-shrink:0;}
    .save-ind{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--surface);border:1px solid var(--border2);padding:10px 18px;font-family:var(--serif);font-size:11px;letter-spacing:0.12em;border-radius:4px;opacity:0;transition:opacity 0.3s;pointer-events:none;}
    .save-ind.show{opacity:1;}
    .save-ind.ok{color:var(--green);}
    .save-ind.saving{color:var(--gold);}
    .save-ind.error{color:var(--red);}
    @media(max-width:600px){.stats-row{grid-template-columns:1fr 1fr;}.color-grid{grid-template-columns:1fr 1fr;}}
  </style>
</head>
<body>

<div class="login-wrap" id="login-wrap">
  <div class="login-box">
    <div class="login-title">FORGE &amp; FABLE</div>
    <div class="login-sub">Inventory — Private Access</div>
    <input type="password" id="pw-input" placeholder="••••••••" onkeydown="if(event.key==='Enter')checkPw()">
    <button class="login-btn" onclick="checkPw()">ENTER</button>
    <div class="login-error" id="pw-error"></div>
  </div>
</div>

<div class="dash" id="dash">
  <nav class="dash-nav">
    <div><span class="dash-logo">FORGE &amp; FABLE</span><span class="dash-tag">INVENTORY</span></div>
    <button class="dash-logout" onclick="logout()">LOCK &amp; EXIT</button>
  </nav>
  <div class="dash-body">
    <div id="loading-msg" class="loading">LOADING INVENTORY...</div>
    <div id="inv-content" style="display:none;">
      <div class="stats-row">
        <div class="stat"><div class="stat-label">PLA BASIC IN STOCK</div><div class="stat-value ok" id="s-bi">—</div></div>
        <div class="stat"><div class="stat-label">PLA BASIC OUT</div><div class="stat-value warn" id="s-bo">—</div></div>
        <div class="stat"><div class="stat-label">PLA MATTE IN STOCK</div><div class="stat-value ok" id="s-mi">—</div></div>
        <div class="stat"><div class="stat-label">PLA MATTE OUT</div><div class="stat-value warn" id="s-mo">—</div></div>
      </div>
      <div class="toolbar">
        <input class="inv-search" type="text" placeholder="Search colors..." oninput="filterColors(this.value)">
        <div class="filter-btns">
          <button class="fbtn active" onclick="setFilter('all',this)">ALL</button>
          <button class="fbtn" onclick="setFilter('basic',this)">PLA BASIC</button>
          <button class="fbtn" onclick="setFilter('matte',this)">PLA MATTE</button>
          <button class="fbtn" onclick="setFilter('out',this)">OUT OF STOCK</button>
        </div>
        <button class="mark-all-btn" onclick="markAllInStock()">MARK ALL IN STOCK</button>
      </div>
      <div class="inv-section" id="sec-basic">
        <div class="inv-section-head"><div class="inv-section-title">PLA BASIC — 30 COLORS</div><div class="inv-section-count" id="cnt-basic"></div></div>
        <div class="color-grid" id="grid-basic"></div>
      </div>
      <div class="inv-section" id="sec-matte">
        <div class="inv-section-head"><div class="inv-section-title">PLA MATTE — 26 COLORS</div><div class="inv-section-count" id="cnt-matte"></div></div>
        <div class="color-grid" id="grid-matte"></div>
      </div>
    </div>
  </div>
</div>

<div class="save-ind" id="save-ind"></div>

<script>
// ════════════════════════════════════════════
//  YOUR SETTINGS — fill these in after setup
// ════════════════════════════════════════════
const PASSWORD     = 'forgefable2025';       // change to your own password
const SUPABASE_URL = 'https://jjbgrwdcknbeaonpbraa.supabase.co';    // from supabase.com project settings
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpqYmdyd2Rja25iZWFvbnBicmFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNTAyMDYsImV4cCI6MjA5NTgyNjIwNn0.dhgH1Y0VPIzbqfV2YAeLX4hgYdyuTO2VuFYNv8j2X_4'; // from supabase.com project settings
// ════════════════════════════════════════════

const TABLE = 'inventory';
const SK    = 'ff_inv_auth';

// ── AUTH ──
function checkPw(){
  if(document.getElementById('pw-input').value === PASSWORD){
    sessionStorage.setItem(SK,'1');
    document.getElementById('login-wrap').style.display = 'none';
    document.getElementById('dash').classList.add('active');
    loadInventory();
  } else {
    document.getElementById('pw-error').textContent = 'Incorrect — try again.';
    document.getElementById('pw-input').value = '';
  }
}
function logout(){ sessionStorage.removeItem(SK); location.reload(); }
if(sessionStorage.getItem(SK)==='1'){
  document.getElementById('login-wrap').style.display='none';
  document.getElementById('dash').classList.add('active');
}

// ── COLOR DATA ──
const BASIC=[
  {name:'Black',hex:'#1a1a1a'},{name:'White',hex:'#f0ede8'},{name:'Gray',hex:'#9e9e9e'},
  {name:'Light Gray',hex:'#d0cec9'},{name:'Dark Gray',hex:'#4a4a4a'},{name:'Silver',hex:'#c0c2c4'},
  {name:'Blue Gray',hex:'#7a8fa6'},{name:'Blue',hex:'#2e6fbc'},{name:'Cobalt Blue',hex:'#1a3a7a'},
  {name:'Cyan',hex:'#00b4d8'},{name:'Turquoise',hex:'#00a896'},{name:'Jade',hex:'#2d9e6e'},
  {name:'Bambu Green',hex:'#2d7a3a'},{name:'Bright Green',hex:'#4ccc44'},{name:'Mistletoe Green',hex:'#4a7c52'},
  {name:'Red',hex:'#cc2222'},{name:'Maroon',hex:'#7a1a1a'},{name:'Magenta',hex:'#cc1ea0'},
  {name:'Hot Pink',hex:'#f0386a'},{name:'Pink',hex:'#f4a0bc'},{name:'Orange',hex:'#f07020'},
  {name:'Pumpkin Orange',hex:'#e05c18'},{name:'Sunflower Yellow',hex:'#f5c800'},{name:'Yellow',hex:'#f0d800'},
  {name:'Beige',hex:'#e8dcc8'},{name:'Bronze',hex:'#a07040'},{name:'Gold',hex:'#d4a817'},
  {name:'Brown',hex:'#7a4a28'},{name:'Cocoa Brown',hex:'#5a3520'},{name:'Indigo Purple',hex:'#3d2e7a'},
];
const MATTE=[
  {name:'Ivory White',hex:'#f5f0e0'},{name:'Bone White',hex:'#e8e0cc'},{name:'Ash Gray',hex:'#8c8c8c'},
  {name:'Nardo Gray',hex:'#9a9a96'},{name:'Charcoal',hex:'#3a3a3a'},{name:'Caramel',hex:'#c4843c'},
  {name:'Latte Brown',hex:'#a07858'},{name:'Dark Brown',hex:'#4a2c18'},{name:'Dark Chocolate',hex:'#3a2018'},
  {name:'Desert Tan',hex:'#c8a878'},{name:'Terracotta',hex:'#c4623c'},{name:'Scarlet Red',hex:'#c82020'},
  {name:'Dark Red',hex:'#7a1818'},{name:'Sakura Pink',hex:'#f0b0b8'},{name:'Lilac Purple',hex:'#9878c0'},
  {name:'Plum',hex:'#6a3878'},{name:'Mandarin Orange',hex:'#e86020'},{name:'Lemon Yellow',hex:'#f0d840'},
  {name:'Apple Green',hex:'#7ab840'},{name:'Grass Green',hex:'#4a9030'},{name:'Dark Green',hex:'#1e5c2a'},
  {name:'Ice Blue',hex:'#a8d4e8'},{name:'Sky Blue',hex:'#5aacdc'},{name:'Marine Blue',hex:'#1a5898'},
  {name:'Dark Blue',hex:'#1a2e6e'},{name:'Cadet Blue',hex:'#4a6e8a'},
];

// ── SUPABASE ──
let stock = {};

async function sb(path, opts={}){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`,{
    ...opts,
    headers:{
      'apikey':SUPABASE_KEY,
      'Authorization':`Bearer ${SUPABASE_KEY}`,
      'Content-Type':'application/json',
      'Prefer':'return=minimal',
      ...opts.headers
    }
  });
  if(!r.ok) throw new Error(r.status);
  return r.status===204?null:r.json();
}

async function loadInventory(){
  try{
    const rows = await sb(`${TABLE}?select=color_name,in_stock`);
    if(rows && rows.length){
      rows.forEach(r=>stock[r.color_name]=r.in_stock);
    } else {
      // First time — seed all colors
      const seed=[
        ...BASIC.map(c=>({color_name:'B_'+c.name,in_stock:true,material:'PLA Basic'})),
        ...MATTE.map(c=>({color_name:'M_'+c.name,in_stock:true,material:'PLA Matte'})),
      ];
      await sb(TABLE,{method:'POST',body:JSON.stringify(seed)});
      seed.forEach(r=>stock[r.color_name]=true);
    }
    document.getElementById('loading-msg').style.display='none';
    document.getElementById('inv-content').style.display='block';
    renderAll();
  }catch(e){
    document.getElementById('loading-msg').textContent='Could not connect — check your Supabase credentials in the file.';
    console.error(e);
  }
}

async function toggleStock(key){
  stock[key]=!stock[key];
  renderAll();
  showInd('saving','SAVING...');
  try{
    await sb(`${TABLE}?color_name=eq.${encodeURIComponent(key)}`,{
      method:'PATCH',body:JSON.stringify({in_stock:stock[key]})
    });
    showInd('ok','SAVED');
  }catch(e){ showInd('error','SAVE FAILED'); }
}

async function markAllInStock(){
  if(!confirm('Mark ALL colors as in stock?')) return;
  Object.keys(stock).forEach(k=>stock[k]=true);
  renderAll();
  showInd('saving','SAVING...');
  try{
    await sb(`${TABLE}?in_stock=eq.false`,{method:'PATCH',body:JSON.stringify({in_stock:true})});
    showInd('ok','ALL SAVED');
  }catch(e){ showInd('error','SAVE FAILED'); }
}

// ── RENDER ──
let activeFilter='all', searchVal='';
function setFilter(f,el){ activeFilter=f; document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active')); el.classList.add('active'); renderAll(); }
function filterColors(v){ searchVal=v.toLowerCase(); renderAll(); }

function renderAll(){
  renderGrid('grid-basic',BASIC,'B_','cnt-basic','sec-basic','basic');
  renderGrid('grid-matte',MATTE,'M_','cnt-matte','sec-matte','matte');
  updateStats();
}

function renderGrid(gid,colors,pfx,cid,sid,type){
  const sec=document.getElementById(sid);
  if(activeFilter!=='all'&&activeFilter!==type&&activeFilter!=='out'){sec.style.display='none';return;}
  const items=colors.map(c=>{
    const key=pfx+c.name, inStock=stock[key]!==false;
    if(activeFilter==='out'&&inStock) return null;
    if(searchVal&&!c.name.toLowerCase().includes(searchVal)) return null;
    return{c,key,inStock};
  }).filter(Boolean);
  if(!items.length){sec.style.display='none';return;}
  sec.style.display='block';
  document.getElementById(cid).textContent=`${items.filter(i=>i.inStock).length} / ${items.length} IN STOCK`;
  document.getElementById(gid).innerHTML=items.map(({c,key,inStock})=>`
    <div class="color-item ${inStock?'in-stock':'out-of-stock'}" onclick="toggleStock('${key}')">
      <div class="color-swatch" style="background:${c.hex}"></div>
      <span class="color-name">${c.name}</span>
      <span class="color-status">${inStock?'IN STOCK':'OUT'}</span>
      <input type="checkbox" class="color-checkbox" ${inStock?'checked':''} onclick="event.stopPropagation();toggleStock('${key}')">
    </div>`).join('');
}

function updateStats(){
  const bi=BASIC.filter(c=>stock['B_'+c.name]!==false).length;
  const mi=MATTE.filter(c=>stock['M_'+c.name]!==false).length;
  document.getElementById('s-bi').textContent=bi;
  document.getElementById('s-bo').textContent=BASIC.length-bi;
  document.getElementById('s-mi').textContent=mi;
  document.getElementById('s-mo').textContent=MATTE.length-mi;
}

function showInd(type,msg){
  const el=document.getElementById('save-ind');
  el.textContent=msg; el.className=`save-ind ${type} show`;
  if(type!=='saving') setTimeout(()=>el.classList.remove('show'),2000);
}

if(sessionStorage.getItem(SK)==='1') loadInventory();
</script>
</body>
</html>
