<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory — Internal</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Pro:ital,wght@0,400;1,400&display=swap');
    *{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --bg:#0d0f14;--surface:#13161e;--surface2:#1a1e2a;--surface3:#1f2435;
      --gold:#c9a84c;--gold2:#e8c97a;--ember:#d4541a;
      --text:#e8e2d5;--muted:#7a7467;--soft:#a09890;
      --border:rgba(201,168,76,0.12);--border2:rgba(201,168,76,0.25);
      --green:#4a9e6b;--red:#b84040;
      --serif:'Cinzel',serif;--body:'Crimson Pro',Georgia,serif;
    }
    body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;min-height:100vh;}

    /* ── LOGIN SCREEN ── */
    .login-wrap{
      display:flex;align-items:center;justify-content:center;
      min-height:100vh;padding:2rem;
    }
    .login-box{
      background:var(--surface);border:1px solid var(--border2);
      padding:2.5rem;width:100%;max-width:360px;text-align:center;
    }
    .login-title{font-family:var(--serif);font-size:18px;color:var(--gold);letter-spacing:0.15em;margin-bottom:6px;}
    .login-sub{font-size:15px;color:var(--muted);font-style:italic;margin-bottom:2rem;}
    .login-box input[type=password]{
      width:100%;background:var(--surface2);border:1px solid var(--border);
      color:var(--text);font-family:var(--body);font-size:16px;
      padding:11px 14px;outline:none;text-align:center;letter-spacing:0.2em;
      margin-bottom:1rem;border-radius:4px;
    }
    .login-box input[type=password]:focus{border-color:var(--border2);}
    .login-btn{
      width:100%;padding:13px;font-family:var(--serif);font-size:12px;
      letter-spacing:0.18em;background:var(--gold);color:#0d0f14;
      border:none;cursor:pointer;border-radius:4px;
    }
    .login-btn:hover{background:var(--gold2);}
    .login-error{
      font-size:14px;color:var(--red);font-style:italic;
      margin-top:10px;min-height:20px;
    }

    /* ── DASHBOARD ── */
    .dash{display:none;}
    .dash.active{display:block;}

    .dash-nav{
      background:var(--surface);border-bottom:1px solid var(--border2);
      padding:0 2rem;height:60px;display:flex;align-items:center;
      justify-content:space-between;
    }
    .dash-logo{font-family:var(--serif);font-size:15px;color:var(--gold);letter-spacing:0.14em;}
    .dash-logo span{font-size:11px;color:var(--ember);letter-spacing:0.2em;margin-left:12px;}
    .dash-logout{
      font-family:var(--serif);font-size:11px;letter-spacing:0.12em;
      color:var(--muted);background:none;border:1px solid var(--border);
      padding:6px 14px;cursor:pointer;border-radius:4px;
    }
    .dash-logout:hover{color:var(--gold);border-color:var(--border2);}

    .dash-body{padding:2rem;max-width:1100px;margin:0 auto;}

    /* Stats bar */
    .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:2rem;}
    .stat{background:var(--surface);border:1px solid var(--border);padding:1rem 1.25rem;}
    .stat-label{font-family:var(--serif);font-size:10px;color:var(--muted);letter-spacing:0.18em;margin-bottom:5px;}
    .stat-value{font-family:var(--serif);font-size:22px;color:var(--text);}
    .stat-value.warn{color:var(--ember);}
    .stat-value.ok{color:var(--green);}

    /* Section */
    .inv-section{margin-bottom:2.5rem;}
    .inv-section-head{
      display:flex;align-items:center;justify-content:space-between;
      margin-bottom:1rem;padding-bottom:8px;border-bottom:1px solid var(--border2);
    }
    .inv-section-title{font-family:var(--serif);font-size:13px;color:var(--ember);letter-spacing:0.2em;}
    .inv-section-count{font-family:var(--serif);font-size:11px;color:var(--muted);letter-spacing:0.12em;}

    /* Filter / search bar */
    .toolbar{display:flex;gap:10px;margin-bottom:1.25rem;flex-wrap:wrap;align-items:center;}
    .inv-search{
      flex:1;min-width:180px;background:var(--surface2);border:1px solid var(--border);
      color:var(--text);font-family:var(--body);font-size:15px;padding:8px 12px;
      outline:none;border-radius:4px;
    }
    .inv-search:focus{border-color:var(--border2);}
    .filter-btns{display:flex;gap:6px;}
    .fbtn{
      font-family:var(--serif);font-size:10px;letter-spacing:0.1em;
      padding:6px 13px;background:transparent;color:var(--muted);
      border:1px solid var(--border);cursor:pointer;border-radius:4px;
    }
    .fbtn.active{color:var(--gold);border-color:var(--border2);}
    .mark-all-btn{
      font-family:var(--serif);font-size:10px;letter-spacing:0.1em;
      padding:6px 13px;background:transparent;color:var(--muted);
      border:1px solid var(--border);cursor:pointer;border-radius:4px;margin-left:auto;
    }
    .mark-all-btn:hover{color:var(--gold);border-color:var(--border2);}

    /* Color grid */
    .color-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;}
    .color-item{
      background:var(--surface2);border:1px solid var(--border);
      border-radius:4px;padding:0.6rem 0.75rem;
      display:flex;align-items:center;gap:10px;
      cursor:pointer;transition:border-color 0.15s,background 0.15s;
      user-select:none;
    }
    .color-item:hover{border-color:var(--border2);}
    .color-item.in-stock{border-left:3px solid var(--green);}
    .color-item.out-of-stock{border-left:3px solid var(--red);opacity:0.55;}
    .color-swatch{width:24px;height:24px;border-radius:50%;flex-shrink:0;border:1px solid rgba(255,255,255,0.1);}
    .color-name{font-size:14px;color:var(--text);flex:1;}
    .color-item.out-of-stock .color-name{color:var(--muted);}
    .color-status{font-family:var(--serif);font-size:9px;letter-spacing:0.08em;flex-shrink:0;}
    .color-item.in-stock .color-status{color:var(--green);}
    .color-item.out-of-stock .color-status{color:var(--red);}
    .color-checkbox{
      width:17px;height:17px;accent-color:var(--gold);
      cursor:pointer;flex-shrink:0;
    }

    /* Save indicator */
    .save-indicator{
      position:fixed;bottom:1.5rem;right:1.5rem;
      background:var(--surface);border:1px solid var(--border2);
      padding:10px 18px;font-family:var(--serif);font-size:11px;
      color:var(--green);letter-spacing:0.12em;border-radius:4px;
      opacity:0;transition:opacity 0.3s;pointer-events:none;
    }
    .save-indicator.show{opacity:1;}

    @media(max-width:600px){
      .stats-row{grid-template-columns:1fr 1fr;}
      .color-grid{grid-template-columns:1fr 1fr;}
    }
  </style>
</head>
<body>

<!-- ── LOGIN ── -->
<div class="login-wrap" id="login-wrap">
  <div class="login-box">
    <div class="login-title">FORGE &amp; FABLE</div>
    <div class="login-sub">Inventory — Private Access</div>
    <input type="password" id="pw-input" placeholder="••••••••" onkeydown="if(event.key==='Enter')checkPw()">
    <button class="login-btn" onclick="checkPw()">ENTER</button>
    <div class="login-error" id="pw-error"></div>
  </div>
</div>

<!-- ── DASHBOARD ── -->
<div class="dash" id="dash">
  <nav class="dash-nav">
    <div>
      <span class="dash-logo">FORGE &amp; FABLE</span>
      <span class="dash-logo" style="font-size:11px;color:var(--ember);letter-spacing:0.2em;">INVENTORY</span>
    </div>
    <button class="dash-logout" onclick="logout()">LOCK &amp; EXIT</button>
  </nav>

  <div class="dash-body">

    <div class="stats-row">
      <div class="stat"><div class="stat-label">PLA BASIC IN STOCK</div><div class="stat-value ok" id="stat-basic-in">—</div></div>
      <div class="stat"><div class="stat-label">PLA BASIC OUT</div><div class="stat-value warn" id="stat-basic-out">—</div></div>
      <div class="stat"><div class="stat-label">PLA MATTE IN STOCK</div><div class="stat-value ok" id="stat-matte-in">—</div></div>
      <div class="stat"><div class="stat-label">PLA MATTE OUT</div><div class="stat-value warn" id="stat-matte-out">—</div></div>
    </div>

    <div class="toolbar">
      <input class="inv-search" type="text" placeholder="Search colors..." oninput="filterColors(this.value)" id="search-box">
      <div class="filter-btns">
        <button class="fbtn active" onclick="setFilter('all',this)">ALL</button>
        <button class="fbtn" onclick="setFilter('basic',this)">PLA BASIC</button>
        <button class="fbtn" onclick="setFilter('matte',this)">PLA MATTE</button>
        <button class="fbtn" onclick="setFilter('out',this)">OUT OF STOCK</button>
      </div>
      <button class="mark-all-btn" onclick="markAllInStock()">MARK ALL IN STOCK</button>
    </div>

    <div class="inv-section" id="section-basic">
      <div class="inv-section-head">
        <div class="inv-section-title">PLA BASIC — 30 COLORS</div>
        <div class="inv-section-count" id="count-basic"></div>
      </div>
      <div class="color-grid" id="grid-basic"></div>
    </div>

    <div class="inv-section" id="section-matte">
      <div class="inv-section-head">
        <div class="inv-section-title">PLA MATTE — 26 COLORS</div>
        <div class="inv-section-count" id="count-matte"></div>
      </div>
      <div class="color-grid" id="grid-matte"></div>
    </div>

  </div>
</div>

<div class="save-indicator" id="save-indicator">SAVED</div>

<script>
// ── PASSWORD ──
// Change this to whatever password you want
const PASSWORD = 'forgefable2025';
const SESSION_KEY = 'ff_inv_auth';
const STOCK_KEY   = 'ff_inv_stock';

function checkPw(){
  const val = document.getElementById('pw-input').value;
  if(val === PASSWORD){
    sessionStorage.setItem(SESSION_KEY, '1');
    document.getElementById('login-wrap').style.display = 'none';
    document.getElementById('dash').classList.add('active');
    renderAll();
  } else {
    document.getElementById('pw-error').textContent = 'Incorrect password — try again.';
    document.getElementById('pw-input').value = '';
  }
}

function logout(){
  sessionStorage.removeItem(SESSION_KEY);
  location.reload();
}

// Auto-login if session is still active
if(sessionStorage.getItem(SESSION_KEY) === '1'){
  document.getElementById('login-wrap').style.display = 'none';
  document.getElementById('dash').classList.add('active');
}

// ── COLOR DATA ──
const BASIC = [
  {name:'Black',hex:'#1a1a1a'},{name:'White',hex:'#f0ede8'},{name:'Gray',hex:'#9e9e9e'},
  {name:'Light Gray',hex:'#d0cec9'},{name:'Dark Gray',hex:'#4a4a4a'},{name:'Silver',hex:'#c0c2c4'},
  {name:'Blue Gray',hex:'#7a8fa6'},{name:'Blue',hex:'#2e6fbc'},{name:'Cobalt Blue',hex:'#1a3a7a'},
  {name:'Cyan',hex:'#00b4d8'},{name:'Turquoise',hex:'#00a896'},{name:'Jade',hex:'#2d9e6e'},
  {name:'Bambu Green',hex:'#2d7a3a'},{name:'Bright Green',hex:'#4ccc44'},{name:'Mistletoe Green',hex:'#4a7c52'},
  {name:'Red',hex:'#cc2222'},{name:'Maroon',hex:'#7a1a1a'},{name:'Magenta',hex:'#cc1ea0'},
  {name:'Hot Pink',hex:'#f0386a'},{name:'Pink',hex:'#f4a0bc'},{name:'Orange',hex:'#f07020'},
  {name:'Pumpkin Orange',hex:'#e05c18'},{name:'Sunflower Yellow',hex:'#f5c800'},{name:'Yellow',hex:'#f0d800'},
  {name:'Beige',hex:'#e8dcc8'},{name:'Bronze',hex:'#a07040'},{name:'Gold',hex:'#d4a817'},
  {name:'Brown',hex:'#7a4a28'},{name:'Cocoa Brown',hex:'#5a3520'},{name:'Indigo Purple',hex:'#3d2e7a'},
];

const MATTE = [
  {name:'Ivory White',hex:'#f5f0e0'},{name:'Bone White',hex:'#e8e0cc'},{name:'Ash Gray',hex:'#8c8c8c'},
  {name:'Nardo Gray',hex:'#9a9a96'},{name:'Charcoal',hex:'#3a3a3a'},{name:'Caramel',hex:'#c4843c'},
  {name:'Latte Brown',hex:'#a07858'},{name:'Dark Brown',hex:'#4a2c18'},{name:'Dark Chocolate',hex:'#3a2018'},
  {name:'Desert Tan',hex:'#c8a878'},{name:'Terracotta',hex:'#c4623c'},{name:'Scarlet Red',hex:'#c82020'},
  {name:'Dark Red',hex:'#7a1818'},{name:'Sakura Pink',hex:'#f0b0b8'},{name:'Lilac Purple',hex:'#9878c0'},
  {name:'Plum',hex:'#6a3878'},{name:'Mandarin Orange',hex:'#e86020'},{name:'Lemon Yellow',hex:'#f0d840'},
  {name:'Apple Green',hex:'#7ab840'},{name:'Grass Green',hex:'#4a9030'},{name:'Dark Green',hex:'#1e5c2a'},
  {name:'Ice Blue',hex:'#a8d4e8'},{name:'Sky Blue',hex:'#5aacdc'},{name:'Marine Blue',hex:'#1a5898'},
  {name:'Dark Blue',hex:'#1a2e6e'},{name:'Cadet Blue',hex:'#4a6e8a'},
];

// ── STOCK STATE ──
// Load from localStorage or default all to in-stock
function loadStock(){
  const saved = localStorage.getItem(STOCK_KEY);
  if(saved) return JSON.parse(saved);
  const state = {};
  BASIC.forEach(c => state['B_'+c.name] = true);
  MATTE.forEach(c => state['M_'+c.name] = true);
  return state;
}

let stock = loadStock();

function saveStock(){
  localStorage.setItem(STOCK_KEY, JSON.stringify(stock));
  const ind = document.getElementById('save-indicator');
  ind.classList.add('show');
  setTimeout(() => ind.classList.remove('show'), 1800);
}

// ── FILTER STATE ──
let activeFilter = 'all';
let searchVal = '';

function setFilter(f, el){
  activeFilter = f;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderAll();
}

function filterColors(v){
  searchVal = v.toLowerCase();
  renderAll();
}

function markAllInStock(){
  if(!confirm('Mark ALL colors as in stock?')) return;
  Object.keys(stock).forEach(k => stock[k] = true);
  saveStock();
  renderAll();
}

// ── RENDER ──
function renderAll(){
  renderGrid('grid-basic', BASIC, 'B_', 'count-basic', 'section-basic');
  renderGrid('grid-matte', MATTE, 'M_', 'count-matte', 'section-matte');
  updateStats();
}

function renderGrid(gridId, colors, prefix, countId, sectionId){
  const grid = document.getElementById(gridId);
  const section = document.getElementById(sectionId);

  const showBasic = activeFilter === 'all' || activeFilter === 'basic';
  const showMatte = activeFilter === 'all' || activeFilter === 'matte';
  const isBasic   = prefix === 'B_';
  const isMatte   = prefix === 'M_';

  if((isBasic && !showBasic) || (isMatte && !showMatte)){
    section.style.display = 'none';
    return;
  }

  let items = colors.map(c => {
    const key = prefix + c.name;
    const inStock = stock[key] !== false;
    if(activeFilter === 'out' && inStock) return null;
    if(searchVal && !c.name.toLowerCase().includes(searchVal)) return null;
    return {c, key, inStock};
  }).filter(Boolean);

  if(!items.length){
    section.style.display = 'none';
    return;
  }

  section.style.display = 'block';
  document.getElementById(countId).textContent = `${items.filter(i=>i.inStock).length} / ${items.length} IN STOCK`;

  grid.innerHTML = items.map(({c, key, inStock}) => `
    <div class="color-item ${inStock ? 'in-stock' : 'out-of-stock'}"
         onclick="toggleStock('${key}')" id="item-${key.replace(/\s/g,'_')}">
      <div class="color-swatch" style="background:${c.hex}"></div>
      <span class="color-name">${c.name}</span>
      <span class="color-status">${inStock ? 'IN STOCK' : 'OUT'}</span>
      <input type="checkbox" class="color-checkbox" ${inStock ? 'checked' : ''}
             onclick="event.stopPropagation();toggleStock('${key}')">
    </div>
  `).join('');
}

function toggleStock(key){
  stock[key] = !stock[key];
  saveStock();
  renderAll();
}

function updateStats(){
  const basicIn  = BASIC.filter(c => stock['B_'+c.name] !== false).length;
  const basicOut = BASIC.length - basicIn;
  const matteIn  = MATTE.filter(c => stock['M_'+c.name] !== false).length;
  const matteOut = MATTE.length - matteIn;
  document.getElementById('stat-basic-in').textContent  = basicIn;
  document.getElementById('stat-basic-out').textContent = basicOut;
  document.getElementById('stat-matte-in').textContent  = matteIn;
  document.getElementById('stat-matte-out').textContent = matteOut;
}

// Init
if(sessionStorage.getItem(SESSION_KEY) === '1') renderAll();
</script>
</body>
</html>
